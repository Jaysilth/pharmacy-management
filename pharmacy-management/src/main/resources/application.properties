spring.application.name=pharmacy-management

# Server
server.port=${PORT:8080}
# SECURITY FIX: without this, Spring never trusts Render's X-Forwarded-Proto
# header, so it can't reliably tell a request arrived over HTTPS — which
# means the HSTS header (see SecurityConfig) may silently never get sent,
# even though the site is actually served over TLS.
server.forward-headers-strategy=framework

# PostgreSQL — all values come from Render environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT — value comes from Render environment variable
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# CORS — comma-separated list of allowed frontend origins.
# SECURITY FIX: previously wildcarded ("*") with allowCredentials(true).
# Set ALLOWED_ORIGINS in your deployment environment to your real frontend
# origin(s), e.g. https://your-frontend.onrender.com
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Logging
logging.level.org.springframework=INFO
# SECURITY FIX: was DEBUG. This app handles clinical/patient-adjacent data
# (consumable usage tied to surgeries, medicine batches, IOL implantation
# records) — DEBUG-level logging risks writing more request/entity detail
# into Render's log retention than intended. INFO is enough for operational
# visibility without that.
logging.level.com.pharmacy=INFO

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
